{% extends "base.html" %}

{% block content %}

<div class="content">

    <div class="container-fluid">

        <h4 class="page-title">

            {% if object %}
                Edit Task
            {% else %}
                Add Task
            {% endif %}

        </h4>


        <div class="card">

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Save Task

                    </button>


                    <a
                        href="{% url 'task-list' %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
