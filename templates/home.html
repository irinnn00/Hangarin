{% extends "base.html" %}
{% load static %}

{% block content %}

<div class="content">

    <div class="container-fluid">

        <h4 class="page-title">
            Dashboard
        </h4>

        <div class="row">

            <div class="col-md-3">

                <div class="card card-stats">

                    <div class="card-body">

                        <p class="card-category">
                            Total Tasks
                        </p>

                        <h4 class="card-title">
                            {{ total_tasks }}
                        </h4>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card card-stats">

                    <div class="card-body">

                        <p class="card-category">
                            Pending
                        </p>

                        <h4 class="card-title">
                            {{ pending_tasks }}
                        </h4>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card card-stats">

                    <div class="card-body">

                        <p class="card-category">
                            In Progress
                        </p>

                        <h4 class="card-title">
                            {{ in_progress_tasks }}
                        </h4>

                    </div>

                </div>

            </div>


            <div class="col-md-3">

                <div class="card card-stats">

                    <div class="card-body">

                        <p class="card-category">
                            Completed
                        </p>

                        <h4 class="card-title">
                            {{ completed_tasks }}
                        </h4>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
