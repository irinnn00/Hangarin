{% extends "base.html" %}

{% block content %}

<div class="content">

    <div class="container-fluid">

        <div class="card">

            <div class="card-body">

                <h4>
                    Delete Task
                </h4>

                <p>
                    Are you sure you want to delete
                    "{{ object.title }}"?
                </p>


                <form method="post">

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="btn btn-danger">

                        Yes, Delete

                    </button>


                    <a
                        href="{% url 'task-list' %}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
